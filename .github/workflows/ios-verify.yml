name: 移动端验证

on:
  workflow_dispatch:
  push:
    # 显式保留普通分支 Push；只配置 tags 会让 GitHub 排除分支事件。
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "apps/ios/**"
      - "Makefile"
      - ".github/workflows/ios-verify.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "Makefile"
      - ".github/workflows/ios-verify.yml"

jobs:
  ios-verify:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 提供锁定的 Dart 与 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - name: 输出实际 Flutter 与 Dart 版本
        run: flutter --version
      - name: 执行移动端静态检查和测试
        run: make ios-test
      - name: 构建无签名 iOS 应用
        run: cd apps/ios && flutter build ios --release --no-codesign
      - name: 打包无签名 IPA
        # 普通 Push/PR 只验证构建；仅手动运行或版本标签需要形成可下载安装包。
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd apps/ios
          mkdir -p build/unsigned-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned-ipa/Payload/Runner.app
          cd build/unsigned-ipa
          zip -qry ../shangan-ios-unsigned.ipa Payload
      - name: 构建 Android Debug APK
        run: cd apps/ios && flutter build apk --debug
      - name: 上传无签名 IPA
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: shangan-ios-unsigned
          path: apps/ios/build/shangan-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
      - name: 上传 Android APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: shangan-android-debug
          path: apps/ios/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  mobile-release-assets:
    name: 发布移动端安装包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ios-verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 下载移动端构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: shangan-*
          path: release-assets
          merge-multiple: true
      - name: 规范发布文件名
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 对外附件统一使用仓库名、版本号和平台名，不在文件名中暴露构建类型。
          mv release-assets/shangan-ios-unsigned.ipa "release-assets/Ashorex-${version}-ios.ipa"
          mv release-assets/app-debug.apk "release-assets/Ashorex-${version}-android.apk"
      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 发布 Job 不检出仓库，显式指定目标仓库，避免 gh CLI 无法推断上下文。
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # 两个发布工作流可能同时创建 Release；最后一次查询用于安全处理并发创建。
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "上岸 ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release view "${GITHUB_REF_NAME}" >/dev/null
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
