name: 服务端验证

on:
  workflow_dispatch:
  push:
    # 显式保留普通分支 Push；只配置 tags 会让 GitHub 排除分支事件。
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "apps/server/**"
      - "apps/admin-web/**"
      - "infra/**"
      - "docs/api/openapi.yaml"
      - "infra/scripts/check-openapi-drift.sh"
      - "Makefile"
      - "scripts/check_release_version.py"
      - ".github/workflows/server-verify.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/admin-web/**"
      - "infra/**"
      - "docs/api/openapi.yaml"
      - "infra/scripts/check-openapi-drift.sh"
      - "Makefile"
      - "scripts/check_release_version.py"
      - ".github/workflows/server-verify.yml"

jobs:
  server-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 校验统一发布版本
        run: python3 scripts/check_release_version.py
      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 执行服务端验证
        run: make server-test
      - name: 安装契约检查依赖
        # 使用隔离环境，保证干净 Runner 也能解析手写 YAML 合同。
        run: |
          python3 -m venv .run/openapi-venv
          .run/openapi-venv/bin/pip install PyYAML==6.0.3
          echo "$PWD/.run/openapi-venv/bin" >> "$GITHUB_PATH"
      - name: 校验 OpenAPI 合同无漂移
        run: ./infra/scripts/check-openapi-drift.sh
      - name: 验证升级状态机
        run: python3 -m unittest discover -s infra/updater/tests -v
      - name: 构建服务端 Docker 镜像
        shell: bash
        run: |
          release_version=dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then release_version="${GITHUB_REF_NAME#v}"; fi
          docker build --file infra/docker/server.Dockerfile --build-arg SHANGAN_VERSION="$release_version" --build-arg SHANGAN_REVISION="$GITHUB_SHA" --tag ashorex-server:${{ github.sha }} .
      - name: 真实容器升级与失败恢复 Smoke
        env:
          SMOKE_IMAGE: ashorex-server:${{ github.sha }}
        run: sudo --preserve-env=SMOKE_IMAGE python3 infra/updater/smoke.py
      - name: 导出 Docker 镜像
        # 主分支镜像直接进入 GHCR；tar 包仅供手动下载或版本发布。
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: docker save ashorex-server:${{ github.sha }} | gzip > /tmp/ashorex-server-image.tar.gz
      - name: 上传 Docker 镜像产物
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ashorex-server-image
          path: /tmp/ashorex-server-image.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送服务端镜像到 GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker tag ashorex-server:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/ashorex-server:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ashorex-server:${{ github.sha }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag ashorex-server:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/ashorex-server:"${GITHUB_REF_NAME#v}"
            docker push ghcr.io/${{ github.repository_owner }}/ashorex-server:"${GITHUB_REF_NAME#v}"
            docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/ashorex-server:"${GITHUB_REF_NAME#v}" > /tmp/server-image-digest.txt
            # latest 仅跟随正式发布，首次部署也不会安装 main 的开发构建。
            docker tag ashorex-server:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/ashorex-server:latest
            docker push ghcr.io/${{ github.repository_owner }}/ashorex-server:latest
          fi
      - name: 保存正式镜像引用
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: server-image-digest
          path: /tmp/server-image-digest.txt
          retention-days: 3

  server-release-assets:
    name: 发布服务端镜像包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: server-verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 下载正式镜像引用
        uses: actions/download-artifact@v4
        with:
          name: server-image-digest
          path: /tmp/server-image-digest
      - name: 生成正式升级清单
        shell: bash
        run: |
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export RELEASE_IMAGE="$(cat /tmp/server-image-digest/server-image-digest.txt)"
          python3 infra/updater/publish_manifest.py
      - name: 下载服务端构建产物
        uses: actions/download-artifact@v4
        with:
          name: ashorex-server-image
          path: release-assets
      - name: 规范发布文件名
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv release-assets/ashorex-server-image.tar.gz "release-assets/Ashorex-${version}-server-image.tar.gz"
      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 发布 Job 不检出仓库，显式指定目标仓库，避免 gh CLI 无法推断上下文。
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # 与移动端发布工作流并发时，重复创建失败后再次查询现有 Release。
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release view "${GITHUB_REF_NAME}" >/dev/null
          gh release upload "${GITHUB_REF_NAME}" release-assets/*.tar.gz --clobber
          # 清单最后公布；版本检查不会看到只有名字而没有镜像的半成品。
          gh release upload "${GITHUB_REF_NAME}" release-assets/server-update.json --clobber
