name: 服务端验证

on:
  workflow_dispatch:
  push:
    # 显式保留普通分支 Push；只配置 tags 会让 GitHub 排除分支事件。
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "apps/server/**"
      - "Makefile"
      - ".github/workflows/server-verify.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "Makefile"
      - ".github/workflows/server-verify.yml"

jobs:
  server-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 执行服务端验证
        run: make server-test
      - name: 构建服务端 Docker 镜像
        run: docker build --file infra/docker/server.Dockerfile --tag ashorex-server:${{ github.sha }} .
      - name: 导出 Docker 镜像
        # 主分支镜像直接进入 GHCR；tar 包仅供手动下载或版本发布。
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: docker save ashorex-server:${{ github.sha }} | gzip > /tmp/ashorex-server-image.tar.gz
      - name: 上传 Docker 镜像产物
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ashorex-server-image
          path: /tmp/ashorex-server-image.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送服务端镜像到 GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag ashorex-server:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/ashorex-server:${{ github.sha }}
          docker tag ashorex-server:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/ashorex-server:latest
          docker push ghcr.io/${{ github.repository_owner }}/ashorex-server:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ashorex-server:latest

  server-release-assets:
    name: 发布服务端镜像包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: server-verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 下载服务端构建产物
        uses: actions/download-artifact@v4
        with:
          name: ashorex-server-image
          path: release-assets
      - name: 规范发布文件名
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv release-assets/ashorex-server-image.tar.gz "release-assets/Ashorex-${version}-server-image.tar.gz"
      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # 与移动端发布工作流并发时，重复创建失败后再次查询现有 Release。
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "上岸 ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release view "${GITHUB_REF_NAME}" >/dev/null
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
