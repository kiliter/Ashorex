name: 服务端验证

on:
  push:
    paths:
      - "apps/server/**"
      - "Makefile"
      - ".github/workflows/server-verify.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "Makefile"
      - ".github/workflows/server-verify.yml"

jobs:
  server-verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 安装运行时工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sqlite3
      - name: 执行服务端验证
        run: make server-test
