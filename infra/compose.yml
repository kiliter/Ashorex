# 上岸 V1 单服务进程、单 SQLite 实例部署；秘密仅在运行时从宿主环境注入。
services:
  server:
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    image: shangan-server:local
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PLAYBACK_TICKET_SECRET: ${PLAYBACK_TICKET_SECRET:-}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      EMBY_BASE_URL: ${EMBY_BASE_URL:-}
      EMBY_API_KEY: ${EMBY_API_KEY:-}
      EMBY_USER_ID: ${EMBY_USER_ID:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-mlx-community/Qwen3-ASR-1.7B-8bit}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-Chinese}
      ASR_CHUNK_DURATION_SECONDS: ${ASR_CHUNK_DURATION_SECONDS:-30}
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-1800}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CONTEXT_LENGTH: ${LLM_CONTEXT_LENGTH:-131072}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-8192}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CONTENT_AUTO_FILL_ENABLED: ${CONTENT_AUTO_FILL_ENABLED:-false}
      CONTENT_AUTO_FILL_INTERVAL_MINUTES: ${CONTENT_AUTO_FILL_INTERVAL_MINUTES:-15}
    volumes:
      - study-data:/data
      - study-backup:/backup
    expose:
      - "18080"
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  study-data:
  study-backup:
  caddy-data:
  caddy-config:

networks:
  internal:
