# 上岸 V2 单服务进程、单 SQLite 实例部署；秘密仅在运行时从宿主环境注入。
services:
  server:
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    image: shangan-server:local
    restart: unless-stopped
    environment:
      # 容器内必须监听所有网卡，否则端口映射和反向代理都无法访问。
      SERVER_ADDRESS: "0.0.0.0"
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      EMBY_BASE_URL: ${EMBY_BASE_URL:-}
      EMBY_API_KEY: ${EMBY_API_KEY:-}
      EMBY_USER_ID: ${EMBY_USER_ID:-}
      # 仅部署者允许的个人 Bark HTTPS 源站，用户不能扩展网络权限。
      BARK_ALLOWED_ORIGINS: ${BARK_ALLOWED_ORIGINS:-https://api.day.app}
      SERVERCHAN_SEND_KEY: ${SERVERCHAN_SEND_KEY:-}
    volumes:
      - study-data:/data
      - study-backup:/backup
    expose:
      - "18080"
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  study-data:
  study-backup:
  caddy-data:
  caddy-config:

networks:
  internal:
