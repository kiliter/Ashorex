name: shangan_ios
description: "上岸 iPhone、iPad 与 Android 学习监督客户端。"
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.44.7 stable 自带 Dart 3.13.1，三端统一使用这一稳定基线。
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.44.7 <3.45.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: 5.11.0
  flutter_markdown_plus: 1.0.12
  flutter_riverpod: 3.0.2
  flutter_secure_storage: 11.0.0
  go_router: 17.5.0
  shared_preferences: ^2.5.5
  video_player: 2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
