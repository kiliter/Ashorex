<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>编辑课后题 - 上岸</title>
  </head>
  <body>
    <main>
      <h1 th:text="${question == null ? '新增课后题' : '编辑课后题'}">编辑课后题</h1>
      <p><a th:href="@{/admin/lessons/{lessonId}/questions(lessonId=${lesson.id})}">返回题目列表</a></p>
      <form method="post" th:action="@{/admin/lessons/{lessonId}/questions/save(lessonId=${lesson.id})}">
        <input th:if="${question != null}" type="hidden" name="questionId" th:value="${question.id}" />
        <label>
          题型
          <select name="questionType" required>
            <option value="SINGLE_CHOICE" th:selected="${question == null || question.questionType == 'SINGLE_CHOICE'}">单选题</option>
            <option value="TRUE_FALSE" th:selected="${question != null && question.questionType == 'TRUE_FALSE'}">判断题</option>
          </select>
        </label>
        <label>题目内容 <textarea name="content" required th:text="${question?.content}"></textarea></label>
        <label>答案解析 <textarea name="explanation" th:text="${question?.explanation}"></textarea></label>
        <label>排序 <input type="number" name="sortOrder" required th:value="${question == null ? 0 : question.sortOrder}" /></label>
        <label>启用 <input type="checkbox" name="enabled" value="true" th:checked="${question == null || question.enabled}" /></label>

        <!-- V1 表单固定展示四行；判断题只填写前两行，服务端仍执行精确数量校验。 -->
        <fieldset>
          <legend>选项（至少填写两项，单选正确答案）</legend>
          <div th:each="index : ${#numbers.sequence(0, 3)}">
            <input
              type="hidden"
              name="optionId"
              th:value="${question != null && question.options.size() > index ? question.options[index].id : ''}"
            />
            <label>
              <input
                type="radio"
                name="correctOption"
                th:value="${index}"
                required
                th:checked="${question != null && question.options.size() > index && question.options[index].correct}"
              />
              正确
            </label>
            <input
              name="optionContent"
              th:value="${question != null && question.options.size() > index ? question.options[index].content : ''}"
              th:placeholder="|选项 ${index + 1}|"
            />
          </div>
        </fieldset>
        <p>判断题必须恰好填写两个选项；单选题至少填写两个选项。</p>
        <button type="submit">保存</button>
      </form>
    </main>
  </body>
</html>
