<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/fragments :: head('Emby 配置 · 上岸管理台')}"></head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside th:replace="~{admin/fragments :: navigation('settings')}"></aside>

      <main class="admin-main">
        <header class="page-header">
          <div>
            <p class="page-eyebrow">RUNTIME INTEGRATION</p>
            <h1>Emby 配置</h1>
            <p>管理课程同步和视频播放使用的固定媒体源，保存后新请求立即生效。</p>
          </div>
        </header>

        <div class="alert alert--success" th:if="${saved}">配置已保存并立即生效。</div>
        <div class="alert" th:if="${!fieldErrors.isEmpty()}">配置未保存，请修正标记的字段。</div>

        <form method="post" th:action="@{/admin/settings/integrations}" th:object="${settingsForm}">
          <section class="panel config-panel">
            <div class="panel-header">
              <div>
                <h2>Emby</h2>
                <p>课程同步和播放使用的固定媒体源。</p>
              </div>
              <span
                class="status-pill"
                th:classappend="${currentSettings.emby.configured() ? 'status-pill--ok' : 'status-pill--danger'}"
                th:text="${currentSettings.emby.configured() ? '已配置' : '未配置'}"
              ></span>
            </div>
            <div class="form-grid">
              <label class="field">Base URL
                <input type="url" th:field="*{embyBaseUrl}" placeholder="http://192.168.1.10:8096" />
                <small class="field-error" th:if="${fieldErrors.containsKey('embyBaseUrl')}" th:text="${fieldErrors.get('embyBaseUrl')}"></small>
              </label>
              <label class="field">API Key
                <span class="password-field">
                  <input id="embyApiKey" name="embyApiKey" type="password" th:value="*{embyApiKey}" autocomplete="off" />
                  <button type="button" class="button button--secondary button--small" data-password-toggle="embyApiKey" aria-label="显示 Emby API Key">显示</button>
                </span>
              </label>
              <label class="field">用户 ID
                <input type="text" th:field="*{embyUserId}" />
              </label>
              <p class="section-note">修改 Emby 可能影响正在播放的视频，建议在无人播放时保存。</p>
            </div>
          </section>

          <section class="panel save-panel">
            <div>
              <h2>保存运行时配置</h2>
              <p class="section-note">首次保存后，SQLite 配置优先于环境变量，并随数据库一起备份。</p>
            </div>
            <button type="submit">保存 Emby 配置</button>
          </section>
        </form>
      </main>
    </div>

    <script>
      // 只切换当前页面密码框的可见性，不复制或记录密钥。
      document.querySelectorAll("[data-password-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.passwordToggle);
          const visible = input.type === "text";
          input.type = visible ? "password" : "text";
          button.textContent = visible ? "显示" : "隐藏";
          button.setAttribute("aria-label", `${visible ? "显示" : "隐藏"} ${input.id}`);
        });
      });
    </script>
  </body>
</html>
