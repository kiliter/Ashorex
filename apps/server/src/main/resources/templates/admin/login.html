<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/fragments :: head('登录 - 上岸管理台')}"></head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-brand" aria-labelledby="brand-title">
        <div class="login-brand__mark" aria-hidden="true">岸</div>
        <h1 id="brand-title">让学习进度，有据可查。</h1>
        <p>管理用户、课程、课后题与视频转写，守住每一条可信学习记录。</p>
      </section>

      <section class="login-card" aria-labelledby="login-title">
        <p class="login-card__eyebrow">SHANGAN CONTROL</p>
        <h2 id="login-title">管理员登录</h2>
        <p class="login-card__intro">使用后台管理员账号继续。</p>
        <p class="alert" th:if="${param.error}">用户名或密码错误，请重新输入。</p>
        <p class="alert alert--success" th:if="${param.logout}">已安全退出管理后台。</p>
        <form class="form-grid" method="post" th:action="@{/admin/login}">
          <label class="field" for="username">
            用户名
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="请输入管理员用户名"
              required
              autofocus
            />
          </label>
          <label class="field" for="password">
            密码
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
            />
          </label>
          <button class="login-submit" type="submit">进入管理台</button>
        </form>
      </section>
    </main>
  </body>
</html>
