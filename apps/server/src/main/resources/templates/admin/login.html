<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/fragments :: head('登录 - 上岸管理台')}"></head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-brand"><strong>上岸管理台</strong><span>SHANGAN / OPS</span></div>
        <h2 id="login-title">管理员登录</h2>
        <p class="login-card__intro">管理课程、内容任务、课后题与外部服务配置。</p>
        <p class="alert" th:if="${param.error}">用户名或密码错误，请重新输入。</p>
        <p class="alert alert--success" th:if="${param.logout}">已安全退出管理后台。</p>
        <form class="form-grid" method="post" th:action="@{/admin/login}">
          <label class="field" for="username">
            用户名
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="请输入管理员用户名"
              required
              autofocus
            />
          </label>
          <label class="field" for="password">
            密码
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
            />
          </label>
          <button class="login-submit" type="submit">进入管理台</button>
        </form>
      </section>
    </main>
  </body>
</html>
