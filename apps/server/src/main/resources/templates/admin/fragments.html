<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <!-- 后台页面共用 Head；所有资源均随服务端发布，不依赖外部 CDN。 -->
  <head th:fragment="head(pageTitle)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f6fa" />
    <title th:text="${pageTitle}">上岸管理后台</title>
    <link rel="stylesheet" th:href="@{/assets/admin.css}" />
  </head>
  <body>
    <!-- 高密度桌面后台统一使用顶部导航；小屏仅允许横向滚动，不切回侧栏。 -->
    <header th:fragment="navigation(activePage)" class="topnav">
      <div class="container topnav-inner">
        <a class="logo" th:href="@{/admin/health}">上岸管理台 <small>SHANGAN / OPS</small></a>
        <nav aria-label="管理功能">
          <a class="nav-link" th:classappend="${activePage == 'health' ? ' active' : ''}" th:href="@{/admin/health}">运行状态</a>
          <a class="nav-link" th:classappend="${activePage == 'users' ? ' active' : ''}" th:href="@{/admin/users}">用户管理</a>
          <a class="nav-link" th:classappend="${activePage == 'courses' ? ' active' : ''}" th:href="@{/admin/courses}">课程管理</a>
          <a class="nav-link" th:classappend="${activePage == 'jobs' ? ' active' : ''}" th:href="@{/admin/content-jobs}">内容任务</a>
          <a class="nav-link" th:classappend="${activePage == 'settings' ? ' active' : ''}" th:href="@{/admin/settings/integrations}">服务配置</a>
        </nav>
        <div class="operator">
          <span class="operator-dot" aria-hidden="true"></span>
          <span>ADMIN</span>
          <form method="post" th:action="@{/admin/logout}"><button type="submit">退出</button></form>
        </div>
      </div>
    </header>
  </body>
</html>
