<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/fragments :: head('内容任务 - 上岸管理台')}"></head>
  <body class="admin-body"><div class="admin-shell">
    <header th:replace="~{admin/fragments :: navigation('jobs')}"></header>
    <main class="admin-main">
      <section class="page-head"><div class="container page-head-row"><div><h1 class="page-title" data-code="JOB/04">内容任务</h1><p class="page-desc">每行是一条课时内容生成主任务，转写、摘要和出题在详情中作为子任务展示</p></div><a class="btn btn-secondary" th:href="@{/admin/settings/integrations}">检查服务配置</a></div></section>
      <div class="container workspace" data-task-table-live th:attr="data-live-url=@{/admin/content-jobs/live(courseId=${selectedCourseId},status=${selectedStatus})},data-login-url=@{/admin/login},data-workflow-base=@{/admin/content-jobs/workflows/},data-course-base=@{/admin/content-jobs/courses/}">
        <div class="summary-strip">
          <div class="summary-item"><div class="summary-label">等待任务</div><div class="summary-value" data-stat="queued" th:text="${stats.queued}">0</div></div>
          <div class="summary-item"><div class="summary-label">执行中</div><div class="summary-value" data-stat="running" th:text="${stats.running}">0</div></div>
          <div class="summary-item"><div class="summary-label">近 24h 成功</div><div class="summary-value" data-stat="succeededSince" th:text="${stats.succeededSince}">0</div></div>
          <div class="summary-item"><div class="summary-label">近 24h 失败</div><div class="summary-value" data-stat="failedSince" th:text="${stats.failedSince}">0</div></div>
        </div>
        <section class="panel">
          <div class="panel-head"><div><h2>TASKS / 主任务</h2><p class="muted">一行一个主任务；点击详情查看转写、摘要、出题子任务</p></div><span class="muted"><span data-list-state>自动刷新中</span> · <span class="num" data-row-count th:text="|${#lists.size(mainTasks)} 条|">0 条</span></span></div>
          <form class="toolbar" method="get" th:action="@{/admin/content-jobs}">
            <label><span class="sr-only">课程</span><select name="courseId"><option value="">全部课程</option><option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}" th:selected="${course.id == selectedCourseId}">课程</option></select></label>
            <label><span class="sr-only">主任务状态</span><select name="status"><option value="">全部状态</option><option value="QUEUED" th:selected="${selectedStatus == 'QUEUED'}">等待执行</option><option value="RUNNING" th:selected="${selectedStatus == 'RUNNING'}">执行中</option><option value="FAILED" th:selected="${selectedStatus == 'FAILED'}">存在失败</option><option value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">已结束</option></select></label>
            <button class="btn btn-primary" type="submit">筛选</button>
            <a class="btn btn-secondary" th:href="@{/admin/content-jobs}">清空</a>
          </form>
          <div class="empty-state" data-task-empty th:hidden="${!#lists.isEmpty(mainTasks)}"><strong>没有符合条件的主任务</strong>调整筛选条件，或从课程课时页执行“AI 一下”。</div>
          <div class="table-wrap" data-task-table-wrap th:hidden="${#lists.isEmpty(mainTasks)}">
            <table class="ds-table">
              <thead><tr><th>课程</th><th>主任务</th><th>状态</th><th>子任务进度</th><th>排队时间</th><th>累计耗时</th><th>操作</th></tr></thead>
              <tbody data-task-rows>
                <tr th:each="row : ${mainTasks}">
                  <td><a th:href="@{/admin/content-jobs/courses/{id}(id=${row.courseId})}" th:text="${row.courseName}">课程</a></td>
                  <td class="task-title-cell"><strong>课时内容生成</strong><span class="task-title-cell__meta" th:text="${row.lessonTitle}">课时</span></td>
                  <td><span class="badge" th:classappend="${row.status == 'FAILED' ? ' danger' : (row.status == 'COMPLETED' ? ' success' : ' warning')}" th:text="${row.statusLabel}">状态</span></td>
                  <td class="num" th:text="${row.stageProgressLabel}">0 / 3</td>
                  <td class="num" th:text="${row.queuedAtLabel}">时间</td>
                  <td class="num" th:text="${row.totalDurationLabel}">—</td>
                  <td><a class="btn btn-quiet" th:href="@{/admin/content-jobs/workflows/{courseId}/{lessonId}/{queuedAt}(courseId=${row.courseId},lessonId=${row.lessonId},queuedAt=${row.queuedAt})}">查看详情</a></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="pagination"><span>最多显示最近 500 条主任务</span><span>全局串行：<strong class="num">1</strong></span></div>
        </section>
      </div>
    </main>
  </div>
  <script>
    // 任务表只更新数据行和统计，不重载筛选条件、导航或滚动位置。
    const taskRoot = document.querySelector("[data-task-table-live]");
    let taskTimer;
    let taskRefreshing = false;
    const scheduleTaskRefresh = (delay = 2000) => {
      window.clearTimeout(taskTimer);
      taskTimer = window.setTimeout(refreshTaskRows, delay);
    };
    const statusClass = (status) => status === "FAILED" ? "danger" : (status === "COMPLETED" ? "success" : "warning");
    const cell = (text, className = "") => {
      const element = document.createElement("td");
      element.textContent = text || "—";
      if (className) element.className = className;
      return element;
    };
    const buildTaskRow = (row) => {
      const tableRow = document.createElement("tr");
      const courseCell = document.createElement("td");
      const courseLink = document.createElement("a");
      courseLink.href = `${taskRoot.dataset.courseBase}${encodeURIComponent(row.courseId)}`;
      courseLink.textContent = row.courseName;
      courseCell.appendChild(courseLink);
      const taskCell = document.createElement("td");
      taskCell.className = "task-title-cell";
      const taskName = document.createElement("strong");
      taskName.textContent = "课时内容生成";
      const lessonTitle = document.createElement("span");
      lessonTitle.className = "task-title-cell__meta";
      lessonTitle.textContent = row.lessonTitle;
      taskCell.append(taskName, lessonTitle);
      const statusCell = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = `badge ${statusClass(row.status)}`;
      badge.textContent = row.statusLabel;
      statusCell.appendChild(badge);
      const actionCell = document.createElement("td");
      const action = document.createElement("a");
      action.className = "btn btn-quiet";
      action.href = `${taskRoot.dataset.workflowBase}${encodeURIComponent(row.courseId)}/${encodeURIComponent(row.lessonId)}/${row.queuedAt}`;
      action.textContent = "查看详情";
      actionCell.appendChild(action);
      tableRow.append(courseCell, taskCell, statusCell, cell(row.stageProgressLabel, "num"), cell(row.queuedAtLabel, "num"), cell(row.totalDurationLabel, "num"), actionCell);
      return tableRow;
    };
    const renderTaskRows = (rows) => {
      taskRoot.querySelector("[data-task-rows]").replaceChildren(...rows.map(buildTaskRow));
      taskRoot.querySelector("[data-row-count]").textContent = `${rows.length} 条`;
      taskRoot.querySelector("[data-task-empty]").hidden = rows.length > 0;
      taskRoot.querySelector("[data-task-table-wrap]").hidden = rows.length === 0;
    };
    const refreshTaskRows = async () => {
      if (taskRefreshing) return;
      if (document.hidden) { scheduleTaskRefresh(); return; }
      taskRefreshing = true;
      const state = taskRoot.querySelector("[data-list-state]");
      try {
        const response = await fetch(taskRoot.dataset.liveUrl, {headers: {Accept: "application/json"}, credentials: "same-origin"});
        const contentType = response.headers.get("content-type") || "";
        if (response.redirected || !contentType.includes("application/json")) { window.location.assign(taskRoot.dataset.loginUrl); return; }
        if (!response.ok) throw new Error("任务读取失败");
        const payload = await response.json();
        renderTaskRows(payload.tasks);
        ["queued", "running", "succeededSince", "failedSince"].forEach((name) => { taskRoot.querySelector(`[data-stat="${name}"]`).textContent = payload.stats[name]; });
        state.textContent = "自动刷新中";
      } catch (error) {
        state.textContent = "刷新失败，正在重试";
      } finally {
        taskRefreshing = false;
        scheduleTaskRefresh();
      }
    };
    document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleTaskRefresh(0); });
    scheduleTaskRefresh(800);
  </script>
  </body>
</html>
