<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/fragments :: head('课时管理 - 上岸管理台')}"></head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside th:replace="~{admin/fragments :: navigation('courses')}"></aside>
      <main class="admin-main admin-main--wide">
        <a class="breadcrumb" th:href="@{/admin/courses}">
          <span aria-hidden="true">←</span>
          返回课程列表
        </a>

        <header class="page-header lesson-page-header">
          <div>
            <p class="page-eyebrow">课程内容台账</p>
            <h1 th:text="${course.name}">课程名称</h1>
            <p>集中维护课时开放状态、展示顺序、课后题和学习资料。</p>
          </div>
          <dl class="lesson-summary" aria-label="课程课时汇总">
            <div>
              <dt>课时</dt>
              <dd th:text="|${lessonCount} 个课时|">0 个课时</dd>
            </div>
            <div>
              <dt>已启用</dt>
              <dd th:text="|${enabledLessonCount} / ${lessonCount}|">0 / 0</dd>
            </div>
            <div>
              <dt>已导入内容</dt>
              <dd th:text="|${contentImportedCount} / ${lessonCount}|">0 / 0</dd>
            </div>
          </dl>
        </header>

        <div
          class="alert alert--success"
          th:if="${imported != null}"
          th:text="|已成功导入 ${imported} 集学习内容。|"
        ></div>
        <div class="alert" th:if="${importError != null}" th:text="${importError}"></div>

        <div class="lesson-workspace">
          <section class="panel panel--flush lesson-ledger" aria-labelledby="lesson-list-title">
            <div class="panel-header panel-header--padded lesson-ledger__header">
              <div>
                <h2 id="lesson-list-title">课时列表</h2>
                <p>修改后按行保存；课时顺序会同步影响学习端展示。</p>
              </div>
              <span class="status-pill" th:text="|共 ${lessonCount} 条|">共 0 条</span>
            </div>

            <div class="empty-state empty-state--inset" th:if="${#lists.isEmpty(lessons)}">
              <strong>暂时没有课时</strong>
              返回课程列表执行一次 Emby 同步。
            </div>

            <div class="table-scroll lesson-table-scroll" th:unless="${#lists.isEmpty(lessons)}">
              <table class="lesson-table">
                <thead>
                  <tr>
                    <th scope="col">序号</th>
                    <th scope="col">课时名称</th>
                    <th scope="col">学习内容</th>
                    <th scope="col">学习端</th>
                    <th scope="col">排序</th>
                    <th scope="col" class="lesson-table__actions-heading">操作</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="lesson, lessonStat : ${lessons}">
                    <td class="lesson-sequence" th:text="${#numbers.formatInteger(lessonStat.count, 2)}">01</td>
                    <td class="lesson-title-cell">
                      <strong th:text="${lesson.title}">课时名称</strong>
                      <span class="lesson-media-warning" th:if="${!lesson.available}">Emby 已不可用</span>
                    </td>
                    <td>
                      <span
                        class="status-pill status-pill--ok"
                        th:if="${studyContentUpdatedAtByLessonId.containsKey(lesson.id)}"
                        th:title="${studyContentUpdatedAtByLessonId.get(lesson.id)}"
                      >已导入</span>
                      <span
                        class="status-pill"
                        th:unless="${studyContentUpdatedAtByLessonId.containsKey(lesson.id)}"
                      >未导入</span>
                    </td>
                    <td>
                      <label class="switch-control">
                        <input
                          type="checkbox"
                          name="enabled"
                          value="true"
                          th:checked="${lesson.enabled}"
                          th:form="|lesson-form-${lesson.id}|"
                        />
                        <span class="switch-control__track" aria-hidden="true"></span>
                        <span th:text="${lesson.enabled ? '已启用' : '未启用'}">已启用</span>
                      </label>
                    </td>
                    <td class="lesson-sort-cell">
                      <label th:for="|sort-order-${lesson.id}|" class="visually-hidden">展示顺序</label>
                      <input
                        class="lesson-sort-input data-text"
                        type="number"
                        name="sortOrder"
                        th:id="|sort-order-${lesson.id}|"
                        th:value="${lesson.sortOrder}"
                        th:form="|lesson-form-${lesson.id}|"
                        required
                      />
                    </td>
                    <td>
                      <form
                        th:id="|lesson-form-${lesson.id}|"
                        method="post"
                        th:action="@{/admin/courses/{courseId}/lessons/{lessonId}(courseId=${courseId},lessonId=${lesson.id})}"
                      ></form>
                      <div class="lesson-row-actions">
                        <button class="button--small" type="submit" th:form="|lesson-form-${lesson.id}|">保存</button>
                        <a
                          class="button button--secondary button--small"
                          th:href="@{/admin/lessons/{lessonId}/questions(lessonId=${lesson.id})}"
                        >课后题</a>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <aside class="panel lesson-import-panel" aria-labelledby="lesson-import-title">
            <div class="lesson-import-panel__mark" aria-hidden="true">ZIP</div>
            <div class="panel-header">
              <div>
                <h2 id="lesson-import-title">批量导入学习内容</h2>
                <p>上传完整课程包，重复上传会覆盖对应课时的全文和摘要。</p>
              </div>
            </div>
            <form
              class="form-grid"
              method="post"
              enctype="multipart/form-data"
              th:action="@{/admin/courses/{courseId}/study-content/import(courseId=${courseId})}"
            >
              <label class="file-drop-field">
                <span>选择课程 ZIP</span>
                <small>需包含 manifest.json、transcript.txt 和 summary.md</small>
                <input type="file" name="file" accept=".zip,application/zip" required />
              </label>
              <button type="submit">导入学习内容</button>
            </form>
          </aside>
        </div>
      </main>
    </div>
  </body>
</html>
