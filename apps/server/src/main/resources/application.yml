spring:
  application:
    name: shangan-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:${DATA_DIR:./data}/study.db
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      # Session 表由 Flyway 统一维护，避免框架启动时改写生产数据库结构。
      initialize-schema: never
  servlet:
    multipart:
      # Todo 附件单文件上限 10 MiB，请求额外预留少量 multipart 边界开销。
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # 冻结合同只描述移动端业务 API，管理后台由 Thymeleaf 页面和 MVC 测试覆盖。
  paths-to-match: /api/v1/**

server:
  # 本地开发统一使用 18080，部署环境仍可通过 SERVER_PORT 覆盖。
  port: ${SERVER_PORT:18080}
  # 默认只监听回环地址；需要真机或局域网访问时由 SERVER_ADDRESS 显式放开。
  # 容器部署必须设为 0.0.0.0，并通过防火墙或安全组限制公网直连该端口。
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      # 管理后台 Session 在七天无访问后失效；重启服务不会主动清除。
      timeout: 7d
      cookie:
        http-only: true
        # 本机和局域网 HTTP 开发允许关闭；容器部署默认通过环境变量强制开启。
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    # 所有请求日志都由 RequestIdFilter 写入 requestId；未处于请求线程时显示短横线。
    level: "%5p [requestId:%X{requestId:-}]"

app:
  # Todo 附件与 SQLite 同处本地数据卷，并由备份脚本成套归档。
  attachments-dir: ${ATTACHMENTS_DIR:${DATA_DIR:./data}/attachments}
  # 用户手动上报的诊断日志；与附件隔离，避免混入完成凭证目录。
  diagnostics-dir: ${DIAGNOSTICS_DIR:${DATA_DIR:./data}/diagnostics}
  emby:
    base-url: ${EMBY_BASE_URL:}
    api-key: ${EMBY_API_KEY:}
    user-id: ${EMBY_USER_ID:}
    timeout-seconds: ${EMBY_TIMEOUT_SECONDS:10}
  bark:
    # 个人用户仅可选择可信源站；自建 Bark 由部署者加入，多个源站用逗号分隔。
    allowed-origins: ${BARK_ALLOWED_ORIGINS:https://api.day.app}
  serverchan:
    # 推送基址固定为官方地址；提取为配置项只为让协议测试指向本地假服务。
    base-url: ${SERVERCHAN_BASE_URL:https://sctapi.ftqq.com}
    send-key: ${SERVERCHAN_SEND_KEY:}
    timeout-seconds: ${SERVERCHAN_TIMEOUT_SECONDS:8}
    nag-enabled: ${SERVERCHAN_NAG_ENABLED:true}
    daily-digest-enabled: ${SERVERCHAN_DAILY_DIGEST_ENABLED:false}
  features:
    # 材料（PDF）资源按 ADR-0030 预留，V2 默认关闭。
    document-resources: ${FEATURE_DOCUMENT_RESOURCES:false}
    max-document-size-mb: ${FEATURE_MAX_DOCUMENT_SIZE_MB:200}
  security:
    jwt-secret: ${JWT_SECRET:}
    bootstrap-admin-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
