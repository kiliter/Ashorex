spring:
  application:
    name: shangan-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:${DATA_DIR:./data}/study.db
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  error:
    include-message: never
    include-stacktrace: never
