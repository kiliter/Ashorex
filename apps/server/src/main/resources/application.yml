spring:
  application:
    name: shangan-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:${DATA_DIR:./data}/study.db
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 课程内容压缩包上限为 50 MiB，请求额外预留少量 multipart 边界开销。
      max-file-size: 50MB
      max-request-size: 51MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    # 所有请求日志都由 RequestIdFilter 写入 requestId；未处于请求线程时显示短横线。
    level: "%5p [requestId:%X{requestId:-}]"

app:
  emby:
    base-url: ${EMBY_BASE_URL:}
    api-key: ${EMBY_API_KEY:}
    user-id: ${EMBY_USER_ID:}
  security:
    jwt-secret: ${JWT_SECRET:}
    bootstrap-admin-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
