spring:
  application:
    name: shangan-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:${DATA_DIR:./data}/study.db
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

app:
  emby:
    base-url: ${EMBY_BASE_URL:}
    api-key: ${EMBY_API_KEY:}
    user-id: ${EMBY_USER_ID:}
  security:
    jwt-secret: ${JWT_SECRET:}
    bootstrap-admin-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
