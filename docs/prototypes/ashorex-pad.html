<script>
'use strict';
const frame=document.getElementById('app-frame'),stage=document.getElementById('stage'),device=document.getElementById('device'),space=document.getElementById('canvas-space');
const presets={'pad-landscape':[1180,820],'pad-portrait':[820,1180],phone:[390,844],'phone-landscape':[844,390],'android-portrait':[800,1280],'android-landscape':[1280,800],'split-900':[900,820],'split-700':[700,820],'split-590':[590,820]};
let selected=innerWidth<900?'auto':'pad-landscape',natural=presets['pad-landscape'].slice(),fit=true,currentScale=1;
function resize(){
 const auto=selected==='auto';document.body.classList.toggle('automatic',auto);
 const border=auto?2:16;
 if(auto)natural=[Math.max(280,stage.clientWidth-32),Math.max(240,stage.clientHeight-32)];
 const [w,h]=natural,outerW=w+border,outerH=h+border;
 currentScale=fit?Math.min(1,Math.max(.15,(stage.clientWidth-32)/outerW),Math.max(.15,(stage.clientHeight-36)/outerH)):1;
 device.style.width=outerW+'px';device.style.height=outerH+'px';frame.style.width=w+'px';frame.style.height=h+'px';device.style.transform=`scale(${currentScale})`;
 space.style.width=outerW*currentScale+'px';space.style.height=outerH*currentScale+'px';space.style.marginTop=Math.max(18,(stage.clientHeight-outerH*currentScale)/2)+'px';space.style.marginBottom='18px';
 document.getElementById('size-label').textContent=`${w} × ${h}`;document.getElementById('scale-label').textContent=`显示 ${Math.round(currentScale*100)}%`;
 document.getElementById('fit-label').textContent=fit?'适合':'1:1';document.getElementById('zoom').setAttribute('aria-pressed',String(!fit));
 document.querySelectorAll('[data-preset]').forEach(b=>{const on=b.dataset.preset===selected;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});
 document.getElementById('more-presets').value=selected in presets&&!document.querySelector(`[data-preset="${selected}"]`)?selected:'';
}
function choose(key){selected=key;if(presets[key])natural=presets[key].slice();fit=true;resize();stage.scrollTop=0;stage.scrollLeft=0}
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.preset)));
document.getElementById('more-presets').addEventListener('change',e=>{if(e.target.value)choose(e.target.value)});
document.getElementById('rotate').addEventListener('click',()=>{natural.reverse();selected=Object.keys(presets).find(k=>presets[k][0]===natural[0]&&presets[k][1]===natural[1])||'custom';resize()});
document.getElementById('zoom').addEventListener('click',()=>{fit=!fit;resize()});
document.getElementById('help').addEventListener('click',()=>frame.contentWindow.showHelp?.());
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='ashorex-layout')return;const d=e.data;document.getElementById('nav-label').innerHTML='<span class="dot"></span>'+(d.medium?'侧边导航':'底部导航');document.getElementById('pane-label').textContent=d.twoPane?'课程双栏 · 内容 '+d.contentWidth+'px':'单栏 · 内容 '+d.contentWidth+'px';document.getElementById('boot-message').hidden=true});
new ResizeObserver(resize).observe(stage);
frame.srcdoc='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ashorex · 交互原型</title></head><body>'+document.getElementById('app-source').innerHTML+'</body></html>';
resize();
</script></body></html>
