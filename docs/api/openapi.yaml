components:
  schemas:
    PreferencesRequest:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
        aliveCheckEnabled:
          type: boolean
        aliveCheckIntervalPercent:
          type: integer
          format: int32
          maximum: 50
          minimum: 1
        dayEndLocalTime:
          type: string
          minLength: 1
      required:
      - aliveCheckEnabled
      - aliveCheckIntervalPercent
      - dayEndLocalTime
      - timezone
    PreferencesResponse:
      type: object
      properties:
        timezone:
          type: string
        aliveCheckEnabled:
          type: boolean
        aliveCheckIntervalPercent:
          type: integer
          format: int32
        dayEndLocalTime:
          type: string
    BattleOrderItemRequest:
      type: object
      properties:
        existingItemId:
          type: string
        itemType:
          type: string
          minLength: 1
        mediaItemId:
          type: string
        mockExamPresetId:
          type: string
        sortOrder:
          type: integer
          format: int32
      required:
      - itemType
    SaveBattleOrderRequest:
      type: object
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/BattleOrderItemRequest"
      required:
      - items
    ItemView:
      type: object
      properties:
        id:
          type: string
        itemType:
          type: string
        title:
          type: string
        mediaItemId:
          type: string
        mockExamPresetId:
          type: string
        mockExamName:
          type: string
        plannedSeconds:
          type: integer
          format: int64
        completedSeconds:
          type: integer
          format: int64
        status:
          type: string
        sortOrder:
          type: integer
          format: int32
        immutable:
          type: boolean
    PlanView:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
        version:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemView"
    PresetRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 0
        durationSeconds:
          type: integer
          format: int64
          maximum: 43200
          minimum: 60
        sortOrder:
          type: integer
          format: int32
      required:
      - name
    PresetView:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        durationSeconds:
          type: integer
          format: int64
        sortOrder:
          type: integer
          format: int32
    ExamGoalRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        examDate:
          type: string
          format: date
        targetCompletionDate:
          type: string
          format: date
        reviewBufferDays:
          type: integer
          format: int32
          maximum: 365
          minimum: 0
        courseIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
      required:
      - courseIds
      - examDate
      - name
      - targetCompletionDate
    ExamGoalResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        examDate:
          type: string
          format: date
        targetCompletionDate:
          type: string
          format: date
        reviewBufferDays:
          type: integer
          format: int32
        timezone:
          type: string
        courseIds:
          type: array
          items:
            type: string
    WatchHeartbeatResponse:
      type: object
      properties:
        trustedPositionMs:
          type: integer
          format: int64
        verifiedWatchMs:
          type: integer
          format: int64
        seekAllowed:
          type: boolean
        aliveCheckRequired:
          type: boolean
        completed:
          type: boolean
        status:
          type: string
    WatchHeartbeatRequest:
      type: object
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 0
        positionMs:
          type: integer
          format: int64
          minimum: 0
        playing:
          type: boolean
        foreground:
          type: boolean
        playbackSpeed:
          type: number
          format: double
          minimum: 0
    SessionView:
      type: object
      properties:
        id:
          type: string
        planItemId:
          type: string
        name:
          type: string
        durationSeconds:
          type: integer
          format: int64
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        serverNow:
          type: string
          format: date-time
    AttachmentView:
      type: object
      properties:
        id:
          type: string
        originalFilename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sortOrder:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    SessionWithAttachments:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SessionView"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentView"
    CreateWatchSessionRequest:
      type: object
      properties:
        planItemId:
          type: string
