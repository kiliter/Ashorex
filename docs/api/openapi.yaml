openapi: 3.1.0
info:
  title: 上岸 V1 API
  description: iOS 客户端使用的只读与学习业务接口；所有业务路由统一使用 /api/v1 前缀。
  version: 0.1.0-rc1
servers:
- url: http://localhost:18080
  description: 本地开发服务
paths:
  /api/v1/preferences:
    get:
      tags:
      - auth-controller
      operationId: preferences
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - auth-controller
      operationId: updatePreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
      security:
      - bearerAuth: []
  /api/v1/plans/{date}:
    get:
      tags:
      - daily-plan-controller
      operationId: plan
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlanView"
      security:
      - bearerAuth: []
    put:
      tags:
      - daily-plan-controller
      operationId: save
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveBattleOrderRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlanView"
      security:
      - bearerAuth: []
  /api/v1/mock-exam-presets/{presetId}:
