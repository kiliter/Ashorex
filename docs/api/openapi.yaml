      security:
      - bearerAuth: []
    post:
      tags:
      - quiz-controller
      operationId: submit
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AttemptResult"
      security:
      - bearerAuth: []
  /api/v1/focus-sessions:
    post:
      tags:
      - focus-session-controller
      operationId: start_1
      requestBody:
        content:
          application/json:
            schema:
