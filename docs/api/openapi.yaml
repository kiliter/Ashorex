          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DailyReportView"
      security:
      - bearerAuth: []
  /api/v1/playback/{ticket}/stream:
    get:
      tags:
      - playback-proxy-controller
      operationId: stream
      parameters:
      - name: ticket
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StreamingResponseBody"
  /api/v1/playback/{ticket}/proxy/**:
    get:
      tags:
      - playback-proxy-controller
      operationId: hlsChild
      parameters:
      - name: ticket
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
