  /api/v1/mock-exams/{sessionId}:
    get:
      tags:
      - mock-exam-controller
      operationId: get
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionWithAttachments"
      security:
      - bearerAuth: []
  /api/v1/mock-exams/{sessionId}/attachments/{attachmentId}:
    get:
      tags:
      - mock-exam-controller
      operationId: downloadAttachment
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
      security:
      - bearerAuth: []
  /api/v1/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
      security:
      - bearerAuth: []
  /api/v1/lessons/{lessonId}:
    get:
      tags:
      - catalog-controller
      operationId: lesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LessonResponse"
      security:
      - bearerAuth: []
  /api/v1/lessons/{lessonId}/study-content:
    get:
      tags:
      - catalog-controller
      operationId: studyContent
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LessonStudyContentResponse"
      security:
      - bearerAuth: []
  /api/v1/lessons/{lessonId}/quiz:
