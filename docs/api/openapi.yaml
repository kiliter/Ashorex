      tags:
      - mock-exam-preset-controller
      operationId: update
      parameters:
      - name: presetId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PresetView"
      security:
      - bearerAuth: []
    delete:
      tags:
      - mock-exam-preset-controller
      operationId: delete
      parameters:
      - name: presetId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
  /api/v1/exam-goal:
    get:
      tags:
      - exam-controller
      operationId: goal
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExamGoalResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - exam-controller
      operationId: save_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamGoalRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExamGoalResponse"
      security:
      - bearerAuth: []
