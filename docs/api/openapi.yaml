              schema:
                $ref: "#/components/schemas/Progress"
      security:
      - bearerAuth: []
  /api/v1/debts:
    get:
      tags:
      - debt-controller
      operationId: list_1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
